name: Operation Zero - dealwork buyer checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/dealwork_jobs_scan.py, .github/workflows/dealwork-scan.yml]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/dealwork_jobs_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dealwork-public-buyer-check
          path: research/dealwork_scout/latest.json
          retention-days: 2
