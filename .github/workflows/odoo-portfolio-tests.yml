name: Odoo bank-matching portfolio regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portfolio/odoo-bank-matcher/**'
      - '.github/workflows/odoo-portfolio-tests.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s portfolio/odoo-bank-matcher -p 'test_*.py' -v
      - name: Real CLI smoke test on fictitious data
        run: |
          python portfolio/odoo-bank-matcher/reconcile.py --bank portfolio/odoo-bank-matcher/sample_bank.csv --ledger portfolio/odoo-bank-matcher/sample_ledger.csv --out /tmp/candidates.csv
          python - <<'PY'
          import csv
          with open('/tmp/candidates.csv') as f: rows=list(csv.DictReader(f))
          assert [r['status'] for r in rows]==['candidate_unique','possible_duplicate_bank','possible_duplicate_bank','unmatched_bank'],rows
          print('Verified expected 4 outcomes.')
          PY
