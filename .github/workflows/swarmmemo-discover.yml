name: Operation Zero - discover funded microtasks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/swarmmemo_discover.py'
      - '.github/workflows/swarmmemo-discover.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read official SwarmMemo public API
        run: python scripts/swarmmemo_discover.py
      - name: Preserve original API evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/swarmmemo || true
          if ! git diff --cached --quiet; then
            git commit -m "Record public SwarmMemo task and dataset catalog"
            git push
          fi
